# Terminal & true color support for Ghostty
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",xterm-ghostty:Tc"
set -ga terminal-features ",xterm-ghostty:RGB"

# Extended keys for proper modifier support
set -s extended-keys on

set -g history-limit 200000
set -g prefix C-a
unbind C-b

bind C-a send-prefix

set -sg escape-time 1

set -g base-index 1
setw -g pane-base-index 1

set -g mouse on

# Clipboard passthrough (OSC 52)
set -g set-clipboard on
set -g allow-passthrough on

set-option -g status on
set -g status-interval 5
set -g status-justify centre

setw -g monitor-activity on
set -g visual-activity off

set -g status-left " #(pmset -g batt | grep -o '[0-9]*%%' | tr -d '%%')%% | #{b:pane_current_path} | P:#{window_panes} "
set -g status-left-length 50
set -g status-right " %H:%M %d-%b-%y "

set-window-option -g window-status-format " #I: #{b:pane_current_path} #W "
set-window-option -g window-status-current-format " #I: #{b:pane_current_path} #W "

# Window styles
set -g window-status-current-style "fg=#000000,bg=#5f87af,bold"
set -g window-status-style "fg=#000000,bg=default,bold"

# Pane border styles
set -g pane-active-border-style "fg=green,bold"
set -g pane-border-style "fg=colour238"

bind-key d detach
bind-key C-d detach

# Claude Code popup (prefix + C-c)
bind C-c display-popup -E -w 80% -h 80% "tmux new-session -A -s claude 'claude'"

# Fuzzy session switcher (prefix + S)
bind S display-popup -E "tmux list-sessions -F '#{session_name}' | fzf --reverse | xargs tmux switch-client -t"

# --- TPM Plugins ---
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# tmux-continuum: auto-save every 15 min, auto-restore on tmux start
set -g @continuum-restore 'on'

# Initialize TPM (keep this line at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
